<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sumiji</title>
    <link rel="icon" type="image/x-icon" href="sumiji-logo.png">
    <link rel="stylesheet" href="sumiji.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Happy+Monkey&family=Hina+Mincho&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">

<body>

    <header>
        <a href="kanji-fc.html" class="app-type">Kanji flashcard</a>
               <a href="index.html"> <img src="sumiji-logo.png" id="logo"> </a>
        <a href="vocab-fc.html" class="app-type">Vocabulary flashcard</a>


    </header>
    <div id="kanji-p" class="container">

        <div id="kanji-card" class="card">

            <div class="card-inner">

                <div id="kanjicard-f" class="card-front">

                    <div id="nstamp">
                        <p id="nlevel">N5</p>
                    </div>

                    <h1 id="Kanji" class="card-data" style="font-size: 5rem; font-weight: 500;">火</h1>

                </div>

                <div id="kanjicard-b" class="card-back">

                    <div id="back-top">
                        <p class="card-data"> JLPT</p>
                        <p id="nlevel-back" class="card-data">(N5):</p>
                        <p id="nstars" class="card-data">★☆☆☆☆</p>
                    </div>
                    <div id="back-mid">
                        <h4 id="english-meaning" class="card-data" style="font-size: 2rem;">Fire</h4>
                    </div>
                    <div id="back-butom">
                        <p class="card-data">★</p>
                        <p id="hiragana" class="card-data">ひ</p>
                        <p class="card-data">★</p>
                    </div>


                </div>

            </div>
        </div>

    </div>


    <button id="shuffle"></button>
