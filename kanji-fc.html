<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sumiji</title>
    <link rel="icon" type="image/x-icon" href="sumiji-logo.png">
    <link rel="stylesheet" href="sumiji.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Happy+Monkey&family=Hina+Mincho&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
    <script src="https://js.puter.com/v2/"></script>
    <script src="sumiji.js" defer></script>

         <meta property="og:title" content="Sumiji" />
  <meta property="og:description" content="Your #1 web app to practice kanji and japanese vocabulary!" />
  <meta property="og:image" content="https://github.com/urwinnieverse/Hueareyou/sumiji-logo.png" />
  <meta property="og:url" content="https://urwinnieverse.github.io/sumiji/" />
  <meta property="og:type" content="website" />
    
    
</head>

<body>

    <header>
        <a href="kanji-fc.html" class="app-type">Kanji flashcard</a>
        <img src="sumiji-logo.png" id="logo">
        <a href="vocab-fc.html" class="app-type">Vocabulary flashcard</a>


    </header>
    <div id="kanji-p" class="container">

        <div id="kanji-card" class="card">

            <div class="card-inner">

                <div id="kanjicard-f" class="card-front">

                    <div id="nstamp">
                        <p id="nlevel">N5</p>
                    </div>

                    <h1 id="Kanji" class="card-data" >火</h1>

                </div>

                <div id="kanjicard-b" class="card-back">

                    <div id="back-top">
                        <p class="card-data"> JLPT</p>
                        <p id="nlevel-back" class="card-data">(N5):</p>
                        <p id="nstars" class="card-data">★☆☆☆☆</p>
                    </div>
                    <div id="back-mid">
                        <h4 id="english-meaning" class="card-data" >Fire</h4>
                    </div>
                    <div id="back-butom">
                        <p class="card-data">★</p>
                        <p id="hiragana" class="card-data">ひ</p>
                        <p class="card-data">★</p>
                    </div>


                </div>

            </div>
        </div>

        <div id="buttons">
            <button id="shuffle"></button>
            <button id="speaker"></button>
        </div>

    </div>



</body>

</html>
